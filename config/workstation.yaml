# WorkStation-wide defaults.
# OS definitions live under Pc/Os/<Osname>/os.yaml.

runtime:
  root: /var/lib/workstation
  persistence_root: /var/lib/workstation/persistence
  sessions_root: /var/lib/workstation/sessions

browser:
  bind_address: 127.0.0.1
  port: 8080

desktop:
  window_manager: dwm
  streamer: selkies

persistence:
  provider: github
  repository: PierrotTheFreak/WorkStation
  branch: main
  files_root: Pc/Os
  commit_on_stop: true
  reject_secrets: true

tunnel:
  enabled: false
  provider: cloudflared
  mode: quick
