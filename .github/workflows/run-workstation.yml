name: Run WorkStation

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS to run"
        required: true
        type: choice
        options:
          - Ubuntu-26.04
          - Debian-Trixie
          - Windows-10
        default: Ubuntu-26.04
      name:
        description: "Name for this workstation session"
        required: true
        type: string
        default: workstation
      password:
        description: "Desktop/VNC login password (workflow inputs are not secret)"
        required: true
        type: string
      windows_iso_path:
        description: "Path to a licensed Windows 10 ISO on the runner"
        required: false
        type: string
        default: "Pc/Os/Windows-10/Media/Windows.iso"
      windows_allow_tcg:
        description: "Allow very slow QEMU software emulation when KVM is unavailable"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: workstation-${{ inputs.name }}
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.name }} (${{ inputs.os }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      WORKSTATION_NAME: ${{ inputs.name }}
      WORKSTATION_OS: ${{ inputs.os }}
      WORKSTATION_PASSWORD: ${{ inputs.password }}
      WORKSTATION_WINDOWS_ISO: ${{ inputs.windows_iso_path }}
      WORKSTATION_WINDOWS_ALLOW_TCG: ${{ inputs.windows_allow_tcg }}
    steps:
      - name: Check out WorkStation
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Cloudflare Tunnel
        run: |
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
          sudo apt-get update
          sudo apt-get install -y cloudflared

      - name: Mask workstation password
        run: |
          printf '::add-mask::%s\n' "$WORKSTATION_PASSWORD"

      - name: Install Windows VM dependencies
        if: inputs.os == 'Windows-10'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf novnc websockify

      - name: Download Windows 10 ISO
        if: inputs.os == 'Windows-10'
        run: |
          chmod +x runtime/get-windows-iso.sh
          runtime/get-windows-iso.sh

      - name: Start workstation
        run: |
          chmod +x runtime/run-workstation.sh runtime/persistence.sh runtime/*.sh
          runtime/run-workstation.sh

      # A canceled long-running step can be terminated before its shell trap
      # finishes. This cleanup step runs even when the workstation step is
      # canceled and commits whatever is left in the mounted home directory.
      - name: Persist workstation after session
        if: ${{ always() }}
        run: |
          chmod +x runtime/persistence.sh
          if [ -d "${RUNNER_TEMP}/workstation/sessions/${WORKSTATION_NAME}/home" ]; then
            runtime/persistence.sh save "${WORKSTATION_OS}" "${RUNNER_TEMP}/workstation/sessions/${WORKSTATION_NAME}/home"
          else
            echo "WorkStation: no session home directory found; nothing to persist."
          fi
