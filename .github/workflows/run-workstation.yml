name: Run WorkStation

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS to run"
        required: true
        type: choice
        options:
          - Ubuntu-26.04
          - Debian-Trixie
        default: Ubuntu-26.04
      name:
        description: "Name for this workstation session"
        required: true
        type: string
        default: workstation
      password:
        description: "Selkies login password (workflow inputs are not secret)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: workstation-${{ inputs.name }}
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.name }} (${{ inputs.os }})
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 4320
    env:
      WORKSTATION_NAME: ${{ inputs.name }}
      WORKSTATION_OS: ${{ inputs.os }}
      WORKSTATION_PASSWORD: ${{ inputs.password }}
    steps:
      - name: Check out WorkStation
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Mask workstation password
        run: |
          printf '::add-mask::%s\n' "$WORKSTATION_PASSWORD"

      - name: Start workstation
        run: |
          chmod +x runtime/run-workstation.sh runtime/persistence.sh
          runtime/run-workstation.sh
