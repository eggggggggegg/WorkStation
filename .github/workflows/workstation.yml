name: WorkStation

on:
  workflow_dispatch:
    inputs:
      persistent_ref:
        description: "Git ref containing persistent-data/"
        required: false
        default: "main"
        type: string
      desktop_password:
        description: "Optional Selkies password. Leave blank to generate one."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: workstation
  cancel-in-progress: false

jobs:
  workstation:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.persistent_ref }}
          fetch-depth: 1

      - name: Prepare runner
        shell: bash
        run: |
          set -euo pipefail
          command -v docker >/dev/null || { echo "Docker is not available on the GitHub runner"; exit 1; }
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl rsync openssl

      - name: Build workstation image
        shell: bash
        run: docker build --pull -t workstation:local .

      - name: Restore persistent storage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/home runtime/system
          if [ -d persistent-data/home ]; then
            rsync -a --delete persistent-data/home/ runtime/home/
          fi
          if [ -d persistent-data/system ]; then
            rsync -a persistent-data/system/ runtime/system/
          fi

      - name: Create session credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.desktop_password }}" ]; then
            PASSWORD="${{ inputs.desktop_password }}"
          else
            PASSWORD="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 20)"
          fi
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"
          echo "username=workstation" >> "$GITHUB_OUTPUT"

      - name: Start WorkStation
        shell: bash
        env:
          SELKIES_BASIC_AUTH_PASSWORD: ${{ steps.credentials.outputs.password }}
        run: |
          set -euo pipefail
          docker run -d --name workstation             --shm-size=2g             -e SELKIES_BASIC_AUTH_USER=workstation             -e SELKIES_BASIC_AUTH_PASSWORD="$SELKIES_BASIC_AUTH_PASSWORD"             -v "$GITHUB_WORKSPACE/runtime/home:/home/workstation"             -v "$GITHUB_WORKSPACE/runtime/system:/persistent-system:ro"             -p 127.0.0.1:8080:8080             workstation:local

          for i in $(seq 1 300); do
            if curl -fsS -u "workstation:$SELKIES_BASIC_AUTH_PASSWORD"                 http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "Selkies is ready."
              break
            fi
            if [ "$i" = 300 ]; then
              echo "Selkies did not become ready."
              docker logs workstation
              exit 1
            fi
            sleep 1
          done

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64             -o /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > /tmp/cloudflared.log 2>&1 &

          URL=""
          for i in $(seq 1 60); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            [ -n "$URL" ] && break
            sleep 1
          done

          [ -n "$URL" ] || { cat /tmp/cloudflared.log; exit 1; }

          {
            echo "## WorkStation is live"
            echo
            echo "**URL:** $URL"
            echo
            echo "**Username:** workstation"
            echo
            echo "**Password:** ${{ steps.credentials.outputs.password }}"
            echo
            echo "> Temporary Cloudflare Quick Tunnel; the URL stops working when this workflow ends."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep workstation alive
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 21000); do
            if ! docker ps --format '{{.Names}}' | grep -qx workstation; then
              docker logs workstation || true
              exit 1
            fi
            sleep 1
          done

      - name: Snapshot installed applications
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p persistent-data/system
          docker exec workstation bash -lc 'apt-mark showmanual 2>/dev/null | sort -u' > persistent-data/system/apt-manual-packages.txt || true
          docker exec workstation bash -lc 'command -v flatpak >/dev/null && flatpak list --app --columns=application 2>/dev/null | sort -u || true' > persistent-data/system/flatpak-apps.txt || true

      - name: Save complete persistent home
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p persistent-data/home
          if docker ps -a --format '{{.Names}}' | grep -qx workstation; then
            rm -rf persistent-data/home.new
            mkdir -p persistent-data/home.new
            docker cp workstation:/home/workstation/. persistent-data/home.new/
            rm -rf persistent-data/home
            mv persistent-data/home.new persistent-data/home
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A persistent-data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist complete workstation state"
            git push
          fi
