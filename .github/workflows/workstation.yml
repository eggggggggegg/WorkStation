name: WorkStation

on:
  workflow_dispatch:
    inputs:
      persistent_ref:
        description: "Git ref containing persistent-data/"
        required: false
        default: "main"
        type: string
      desktop_password:
        description: "Optional Selkies password. Leave blank to generate one."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: workstation
  cancel-in-progress: false

jobs:
  workstation:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.persistent_ref }}
          fetch-depth: 1

      - name: Install Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends docker.io curl rsync

      - name: Build workstation image
        shell: bash
        run: docker build --pull -t workstation:local .

      - name: Restore persistent home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/home
          if [ -d persistent-data/home ]; then
            rsync -a --delete persistent-data/home/ runtime/home/
          fi

      - name: Create session credentials
        id: credentials
        shell: bash
        env:
          INPUT_PASSWORD: ${{ inputs.desktop_password }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_PASSWORD" ]; then
            PASSWORD="$INPUT_PASSWORD"
          else
            PASSWORD="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 20)"
          fi
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"
          echo "username=workstation" >> "$GITHUB_OUTPUT"

      - name: Start WorkStation
        shell: bash
        env:
          SELKIES_BASIC_AUTH_PASSWORD: ${{ steps.credentials.outputs.password }}
        run: |
          set -euo pipefail
          docker run -d --name workstation \
            --shm-size=2g \
            -e SELKIES_BASIC_AUTH_USER=workstation \
            -e SELKIES_BASIC_AUTH_PASSWORD="$SELKIES_BASIC_AUTH_PASSWORD" \
            -v "$GITHUB_WORKSPACE/runtime/home:/home/workstation" \
            -p 127.0.0.1:8080:8080 \
            workstation:local

          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              break
            fi
            if [ "$i" = 120 ]; then
              docker logs workstation
              exit 1
            fi
            sleep 1
          done

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared

          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 \
            > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid

          URL=""
          for i in $(seq 1 60); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)"
            if [ -n "$URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$URL" ]; then
            cat /tmp/cloudflared.log
            exit 1
          fi

          {
            echo "## WorkStation is live"
            echo
            echo "**URL:** $URL"
            echo
            echo "**Username:** workstation"
            echo
            echo "**Password:** ${{ steps.credentials.outputs.password }}"
            echo
            echo "> Temporary Cloudflare Quick Tunnel; the URL stops working when this workflow ends."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep workstation alive
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 21000); do
            if ! docker ps --format '{{.Names}}' | grep -qx workstation; then
              docker logs workstation || true
              exit 1
            fi
            sleep 1
          done

      - name: Snapshot installed applications
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p persistent-data/system
          docker exec workstation bash -lc 'dpkg-query -W -f="${binary:Package}\n" 2>/dev/null | sort -u' \
            > persistent-data/system/dpkg-packages.txt || true
          docker exec workstation bash -lc 'command -v flatpak >/dev/null && flatpak list --app --columns=application 2>/dev/null | sort -u || true' \
            > persistent-data/system/flatpak-apps.txt || true

      - name: Save complete persistent home
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p persistent-data/home
          if docker ps -a --format '{{.Names}}' | grep -qx workstation; then
            rm -rf persistent-data/home.new
            mkdir -p persistent-data/home.new
            docker cp workstation:/home/workstation/. persistent-data/home.new/
            rm -rf persistent-data/home
            mv persistent-data/home.new persistent-data/home
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A persistent-data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist complete workstation state"
            git push
          fi
