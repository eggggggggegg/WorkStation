name: Windows-10
type: vm
hypervisor: qemu
architecture: x86_64

display:
  protocol: vnc
  web_client: novnc
  transport: websockets

resources:
  cpu: 2
  memory: 4G
  disk: 64G
  acceleration: kvm
  allow_tcg: false

media:
  iso_path: Pc/Os/Windows-10/Media/Windows.iso

runtime:
  disk_path: runtime/windows-10/windows-10.qcow2
  vnc_port: 5900
  web_port: 8080

persistence:
  files_path: Pc/Os/Windows-10/Files
  vm_disk: runtime-only
  restore_before_start: true
  save_on_stop: false
  note: >
    The VM disk is intentionally not committed to Git. Windows user data
    persistence will be added separately so large qcow2 files do not enter
    the repository history.
